name: iOS App Store Upload

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (CFBundleShortVersionString)"
        required: true
        default: "1.2.0"
      build_number:
        description: "Build number (CFBundleVersion)"
        required: true
        default: "1.2.0"

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 90

    env:
      APP_NAME: neoball
      BUNDLE_ID: com.puzzle.caydance.neo.ball.app
      WORKSPACE: neoball.xcworkspace
      SCHEME: neoball
      TEAM_ID: 53WUU8STZ6
      PROFILE_NAME: NeoBallNove

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Ruby / CocoaPods
        run: |
          gem install cocoapods --no-document
          pod --version

      - name: Pod install
        run: |
          pod install --repo-update

      - name: Import signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -o - -)
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Installed profile UUID=$UUID name=$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -o - -)"

      - name: Apply version
        run: |
          MARKETING_VERSION="${{ github.event.inputs.marketing_version }}"
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" neoball/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" neoball/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" neoball/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" neoball/Info.plist 2>/dev/null || true
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $MARKETING_VERSION/" neoball.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/" neoball.xcodeproj/project.pbxproj
          echo "Using version $MARKETING_VERSION ($BUILD_NUMBER)"

      - name: Archive
        run: |
          mkdir -p build
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/$APP_NAME.xcarchive" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]=iPhone Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]=$PROFILE_NAME" \
            -allowProvisioningUpdates

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/$APP_NAME.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$PWD/build/export" \
            -allowProvisioningUpdates

          IPA_PATH=$(ls "$PWD/build/export"/*.ipa | head -n 1)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoball-ipa-${{ github.event.inputs.marketing_version }}
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Uploading $IPA_PATH ..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --output-format xml
